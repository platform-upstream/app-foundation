apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "foundation-reference.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "foundation-reference.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
