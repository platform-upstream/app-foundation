<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clean</title>
<style>
  html, body { overflow-x: clip; overscroll-behavior-x: none; }
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #111; background: #fff; }
  .app-shell { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
  .app-shell-main { flex: 1; overflow-y: auto; overflow-x: clip; overscroll-behavior-x: none; padding: 16px; }
  button, input, select { font: inherit; min-height: 44px; }
  .chip { position: relative; display: inline-block; padding: 0 8px; font-size: 14px; line-height: 20px; border: 1px solid #555; border-radius: 10px; background: none; min-height: 0; min-width: 44px; }
  .chip::after { content: ''; position: absolute; inset: min(0px, calc((100% - 44px) / 2)); }
  .scroller { display: flex; gap: 8px; overflow-x: auto; }
  .scroller span { flex: 0 0 200px; }
  .long { text-overflow: ellipsis; overflow: hidden; white-space: nowrap; display: block; width: 120px; }
  label.check { display: flex; align-items: center; min-height: 44px; gap: 8px; }
  nav { display: flex; }
  nav a { flex: 1; display: grid; place-items: center; min-height: 48px; color: #111; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); clip-path: inset(50%); white-space: nowrap; border: 0; }
  .hit-target { position: relative; }
  .hit-target::after { content: ''; position: absolute; inset: min(0px, calc((100% - 44px) / 2)); }
  .icon-button { width: 44px; padding: 0; }
  .narrow { padding: 0 4px; }
  .small-chip { min-height: 0; height: 24px; padding: 0 12px; font-size: 14px; line-height: 20px; }
  .nav-badge-anchor { position: relative; display: inline-flex; }
  .nav-badge { position: absolute; top: -4px; inset-inline-start: calc(100% - 8px); height: 18px; min-width: 18px; padding-inline: 4px; font-size: 14px; line-height: 1; white-space: nowrap; }
  .card { position: relative; padding: 16px; border: 1px solid #555; }
  .card a::after { content: ''; position: absolute; inset: 0; }
  .card a { font-size: 14px; }
  .bar { position: sticky; top: 0; background: #fff; z-index: 1; }
  .rows button { display: block; width: 100%; }
  summary { min-height: 44px; }
  @media (prefers-reduced-motion: no-preference) { .rise { animation: rise 200ms backwards; } }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
</style>
</head>
<body>
<div class="app-shell">
  <main class="app-shell-main">
    <div class="bar"><button type="button">Zurück</button></div>
    <h1 class="rise">Übersicht</h1>
    <p>Kontostand 1’234’567.80 CHF am 12.11.2026. Mehr im <a href="#hilfe">Hilfeartikel</a> dazu.</p>
    <button type="button">Speichern</button>
    <button type="button" class="chip">Neu</button>
    <button type="button"><span class="long">Ein sehr langer Titel, der abgeschnitten wird</span></button>
    <label class="check"><input type="checkbox"> Erinnern</label>
    <label for="name">Name</label>
    <input id="name" type="text">
    <button type="button" class="icon-button" aria-label="Löschen">X<span class="sr-only">Eintrag 1’234’567 löschen und alles andere dazu</span></button>
    <button type="button" class="hit-target small-chip">Filter</button>
    <button type="button" class="hit-target small-chip narrow" aria-label="Plus">+</button>
    <div class="card"><h2>Rechnung</h2><a href="#r1">Öffnen</a></div>
    <details class="card"><summary>Verlauf</summary><button type="button">Rückgängig</button></details>
    <div class="rows"><button type="button">Zeile 1</button><button type="button">Zeile 2</button><button type="button">Zeile 3</button><button type="button">Zeile 4</button><button type="button">Zeile 5</button><button type="button">Zeile 6</button><button type="button">Zeile 7</button><button type="button">Zeile 8</button><button type="button">Zeile 9</button><button type="button">Zeile 10</button><button type="button">Zeile 11</button><button type="button">Zeile 12</button><button type="button">Zeile 13</button><button type="button">Zeile 14</button><button type="button">Zeile 15</button><button type="button">Zeile 16</button><button type="button">Zeile 17</button><button type="button">Zeile 18</button><button type="button">Zeile 19</button><button type="button">Zeile 20</button><button type="button">Zeile 21</button><button type="button">Zeile 22</button><button type="button">Zeile 23</button><button type="button">Zeile 24</button><button type="button">Zeile 25</button><button type="button">Zeile 26</button><button type="button">Zeile 27</button><button type="button">Zeile 28</button><button type="button">Zeile 29</button><button type="button">Zeile 30</button></div>
    <div class="scroller"><span>Eins</span><span>Zwei</span><span>Drei</span></div>
  </main>
  <nav aria-label="Hauptnavigation"><a href="#a">Start</a><a href="#b"><span class="nav-badge-anchor"><span aria-hidden="true">S</span><span class="nav-badge" role="img" aria-label="12 neue">12</span></span>Suche</a></nav>
</div>
</body>
</html>
