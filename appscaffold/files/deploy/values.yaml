replicaCount: 1

image:
  repository: __IMAGE_REPOSITORY__
  tag: "0.0.1"
  pullPolicy: IfNotPresent

hostname: __APP_HOST__
# Cloudflare Access team domain (<team>.cloudflareaccess.com) and the audience of the app's Access
# application. Both are platform values: set them in the apps-production wrapper, never here.
cfTeamDomain: ""
# platform/.opentofu: tofu output -json app_auds
cfAccessAud: ""
# Client IDs of Access service tokens accepted besides people, comma-separated (agent-verify).
cfAccessServiceTokens: ""

# directory's identity API: who a signed-in person is and their role in this app. Platform values,
# set them in the apps-production wrapper. The Secret (created by the platform, such as an
# ExternalSecret) holds this app's key under directory-key; directory lists the app in its
# `callers` and its namespace in `networkPolicy.callerNamespaces`.
directory:
  # http://directory.<namespace>.svc:8080
  url: ""
  existingSecret: ""

ingress:
  className: traefik

persistence:
  enabled: true
  storageClassName: ""
  size: 1Gi

# Starting values; replace them with measured ones (Console shows the pod's usage).
resources:
  requests:
    cpu: 5m
    memory: 24Mi
  limits:
    cpu: 500m
    memory: 128Mi

runtime:
  goMemLimit: 96MiB
  goMaxProcs: "2"
