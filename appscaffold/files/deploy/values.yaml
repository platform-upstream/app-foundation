replicaCount: 1

image:
  repository: __IMAGE_REPOSITORY__
  tag: "0.0.1"
  pullPolicy: IfNotPresent

hostname: __APP_HOST__
cfTeamDomain: __ACCESS_TEAM__
# Audience of the app's Cloudflare Access application; set in the apps-production wrapper
# (platform/.opentofu: tofu output -json app_auds).
cfAccessAud: ""
# Client IDs of Access service tokens accepted besides people, comma-separated (agent-verify).
cfAccessServiceTokens: ""

ingress:
  className: traefik

persistence:
  enabled: true
  storageClassName: ""
  size: 1Gi

# Starting values; replace them with measured ones (Console shows the pod's usage).
resources:
  requests:
    cpu: 5m
    memory: 24Mi
  limits:
    cpu: 500m
    memory: 128Mi

runtime:
  goMemLimit: 96MiB
  goMaxProcs: "2"
