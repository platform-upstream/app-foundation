apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "__APP_NAME__.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "__APP_NAME__.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
