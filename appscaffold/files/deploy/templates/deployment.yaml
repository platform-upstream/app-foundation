apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "__APP_NAME__.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 1
  # Releases without downtime: the new pod starts beside the old one. Safe with SQLite on the
  # single node's RWO volume (WAL + busy_timeout from app-foundation/sqlite).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "__APP_NAME__.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "__APP_NAME__.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: __APP_NAME__
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: APP_ADDR
              value: ":8080"
            - name: APP_DB
              value: {{ ternary "/data/__APP_NAME__.sqlite" "/tmp/__APP_NAME__.sqlite" .Values.persistence.enabled | quote }}
            - name: APP_ORIGIN
              value: {{ printf "https://%s" (required "hostname is required" .Values.hostname) | quote }}
            - name: CF_TEAM_DOMAIN
              value: {{ .Values.cfTeamDomain | quote }}
            - name: CF_ACCESS_AUD
              value: {{ required "cfAccessAud is required (tofu output -json app_auds)" .Values.cfAccessAud | quote }}
            - name: CF_ACCESS_SERVICE_TOKENS
              value: {{ .Values.cfAccessServiceTokens | quote }}
            - name: GOMEMLIMIT
              value: {{ .Values.runtime.goMemLimit | quote }}
            - name: GOMAXPROCS
              value: {{ .Values.runtime.goMaxProcs | quote }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # Keep serving while Traefik drops the old endpoint (distroless: native sleep, no shell).
          lifecycle:
            preStop:
              sleep:
                seconds: 8
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          volumeMounts:
            - name: temporary
              mountPath: /tmp
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: /data
            {{- end }}
      volumes:
        - name: temporary
          emptyDir:
            sizeLimit: 32Mi
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
        {{- end }}
