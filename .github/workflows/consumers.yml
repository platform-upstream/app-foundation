name: consumers

# Consumer canary: every app that requires this module builds and tests against THIS checkout
# (go.mod replace + vendor), so a change that breaks an app shows up here, before a release, not
# in the app's foundation-bump. The private app repos are read with APPS_READ_TOKEN (fine-grained
# PAT, Contents: read on the app repos only). Each app's frontend is built first because its Go
# package embeds dist/.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so drift in the apps' own main shows up even when this repo is quiet.
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: consumers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: directory
            web: web
            dist: web/dist
          - app: paper
            web: web
            dist: web/dist
            apt: poppler-utils
          - app: console
            web: frontend
            dist: gateway/dist
          - app: memory
    env:
      GOPRIVATE: github.com/platform-upstream/*
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v7
        with:
          path: app-foundation
      - uses: actions/checkout@v7
        with:
          repository: platform-upstream/${{ matrix.app }}
          token: ${{ secrets.APPS_READ_TOKEN }}
          path: app
      - name: System packages
        if: matrix.apt
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ${{ matrix.apt }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: app/go.mod
          check-latest: true
      - uses: actions/setup-node@v7
        if: matrix.web
        with:
          node-version: "26"
      - name: Frontend
        if: matrix.web
        working-directory: app/${{ matrix.web }}
        run: |
          npm install -g "$(node -p 'require("./package.json").packageManager')"
          pnpm install --frozen-lockfile
          pnpm run build
          if [ "${{ matrix.web }}/dist" != "${{ matrix.dist }}" ]; then
            mkdir -p "../${{ matrix.dist }}" && cp -r dist/. "../${{ matrix.dist }}/"
          fi
      - name: Use this checkout of app-foundation
        working-directory: app
        run: |
          go mod edit -replace github.com/platform-upstream/app-foundation=../app-foundation
          GOFLAGS=-mod=mod go mod tidy
          go mod vendor
      - name: Vet
        working-directory: app
        run: go vet ./...
      - name: Test
        working-directory: app
        run: go test ./...
      - name: Frontend registry (informational)
        if: matrix.web
        working-directory: app
        # The app's copies of the registry files against this checkout: a difference is expected
        # when this change touches them; the app takes it with its next foundation-bump sync.
        run: |
          go tool frontend-registry check -target "${{ matrix.web }}" -modules api,pwa,pwa-shell \
            || echo "::notice title=${{ matrix.app }}::frontend registry files differ from this checkout (next foundation-bump syncs them)"
